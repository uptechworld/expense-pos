<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Billing POS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="android-chrome-192x192.png">
<link rel="apple-touch-icon" href="android-chrome-192x192.png">
<title>Billing POS</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root {
  --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
  --primary: #4f46e5; --primary-dark: #4338ca; --primary-soft: #eef2ff;
  --green: #059669; --wa: #16a34a; --danger: #dc2626; --danger-soft: #fef2f2;
  --radius: 14px; --nav-h: 64px; --bar-h: 74px; --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Gurmukhi", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.45;
  padding-bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
}
body[data-tab="bill"], body[data-tab="preview"] { padding-bottom: calc(var(--nav-h) + var(--bar-h) + var(--safe-b) + 20px); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 40; background: var(--card); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; }
.topbar-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { flex: 1; min-width: 0; }
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.top-tabs { display: none; gap: 4px; }
.top-tabs button { border: none; background: none; padding: 9px 14px; border-radius: 10px; font-weight: 600; color: var(--muted); }
.top-tabs button.active { background: var(--primary-soft); color: var(--primary); }
.btn-new { border: none; background: var(--primary); color: #fff; font-weight: 700; padding: 10px 14px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-new .ic { width: 18px; height: 18px; }

/* ---------- Layout ---------- */
.container { max-width: 1180px; margin: 0 auto; padding: 14px 12px; }
.view { display: none; }
body[data-tab="bill"] #view-bill, body[data-tab="preview"] #view-bill,
body[data-tab="history"] #view-history, body[data-tab="reports"] #view-reports,
body[data-tab="settings"] #view-settings { display: block; }
.narrow { max-width: 680px; margin: 0 auto; }
.bill-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
body[data-tab="bill"] .preview-col { display: none; }
body[data-tab="preview"] .bill-col { display: none; }
.stack > * + * { margin-top: 14px; }
.mt { margin-top: 10px; }
.mt14 { margin-top: 14px; }

/* ---------- Cards & fields ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.count { font-size: 13px; color: var(--muted); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; position: relative; }
.label, .field > label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { width: 100%; min-width: 0; height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr 0.9fr 1.1fr; gap: 10px; }
.input-group { display: flex; gap: 8px; }
.input-group select { width: 84px; flex-shrink: 0; }
.hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* ---------- Buttons ---------- */
.btn { border: none; border-radius: 12px; height: 48px; padding: 0 16px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background-color .15s, transform .1s; }
.btn:active { transform: scale(.98); }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-wa { background: var(--wa); color: #fff; }
.btn-light { background: #fff; border: 1px solid var(--line); color: var(--text); }
.btn-danger-light { background: var(--danger-soft); color: var(--danger); }
@media (hover: hover) {
  .btn-primary:hover, .btn-new:hover { background: var(--primary-dark); }
  .btn-light:hover { background: #f8fafc; }
}

/* ---------- Quick chips & suggestions ---------- */
.quick-wrap { margin-bottom: 10px; }
.quick-wrap .label { display: block; margin-bottom: 6px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: #f8fafc; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; }
.chip small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.suggest { position: absolute; top: 100%; left: 0; right: 0; z-index: 30; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 28px rgba(15,23,42,.14); overflow: hidden; display: none; }
.suggest.show { display: block; }
.suggest button { width: 100%; background: none; border: none; border-bottom: 1px solid var(--line); padding: 13px 14px; display: flex; justify-content: space-between; gap: 10px; text-align: left; font-size: 15px; }
.suggest button:last-child { border-bottom: none; }
.suggest small { color: var(--muted); }

/* ---------- Item list ---------- */
.item-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item-row:last-child { border-bottom: none; }
.item-main { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: none; border: none; text-align: left; padding: 2px 0; }
.item-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.item-name { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.item-meta { font-size: 13px; color: var(--muted); }
.item-amt { font-weight: 800; font-size: 15px; white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: none; background: var(--danger-soft); color: var(--danger); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn.plain { background: #f1f5f9; color: var(--text); }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }

/* ---------- Segmented & switch ---------- */
.segmented { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.segmented.two { grid-template-columns: 1fr 1fr; }
.segmented button { height: 44px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-weight: 700; font-size: 14px; padding: 0 4px; }
.segmented button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; font-weight: 600; font-size: 15px; }
.switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .2s; }
.switch span::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .2s; }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::before { transform: translateX(20px); }

/* ---------- Setup card ---------- */
.setup-card { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--primary-soft); border-color: #c7d2fe; }
.setup-text { flex: 1 1 220px; }
.setup-title { font-weight: 800; font-size: 15px; }

/* ---------- Bottom bars ---------- */
.action-bar { display: none; position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); z-index: 45; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(15,23,42,.06); }
body[data-tab="bill"] .action-bar, body[data-tab="preview"] .action-bar { display: block; }
.action-inner { max-width: 1180px; margin: 0 auto; height: var(--bar-h); padding: 0 12px; display: flex; align-items: center; gap: 8px; }
.total-box { flex: 1; min-width: 0; }
.total-label { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.total-amt { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; }
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); }
.bottom-nav button { border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 700; min-width: 0; }
.bottom-nav button span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.bottom-nav button .ic { width: 22px; height: 22px; }
.bottom-nav button.active { color: var(--primary); }
@media (max-width: 899px) { body.kb-open .action-bar, body.kb-open .bottom-nav { display: none !important; } }
@media (max-width: 440px) {
  .action-inner .btn { flex-direction: column; width: 60px; height: 56px; padding: 0; gap: 2px; font-size: 11px; }
  .total-amt { font-size: 20px; }
}

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--bar-h) + var(--safe-b) + 12px); transform: translate(-50%, 16px); z-index: 120; width: max-content; max-width: calc(100% - 24px); background: #0f172a; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.22); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: none; border: none; color: #a5b4fc; font-weight: 800; font-size: 14px; padding: 4px 2px; text-transform: uppercase; }

/* ---------- Popups ---------- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(15,23,42,.5); display: none; align-items: flex-end; justify-content: center; }
.sheet-backdrop.show { display: flex; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: #fff; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + var(--safe-b)); animation: sheetUp .22s ease-out; }
@keyframes sheetUp { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; margin-bottom: 14px; }
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.sheet-actions.three { grid-template-columns: repeat(3, 1fr); }
.sheet-actions.three .btn { flex-direction: column; height: 62px; gap: 4px; font-size: 13px; padding: 0 4px; }
.bs-receipt { background: var(--bg); border-radius: 14px; padding: 14px 8px; overflow-x: auto; }
@media (min-width: 600px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: 20px; } }

/* ---------- History ---------- */
.date-head { font-size: 12.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 16px 4px 8px; }
.bill-card { width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; }
.bill-card + .bill-card { margin-top: 8px; }
.b-left, .b-right { display: flex; flex-direction: column; min-width: 0; }
.b-right { align-items: flex-end; flex-shrink: 0; }
.b-no { font-weight: 800; font-size: 15px; }
.b-meta { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-amt { font-weight: 800; font-size: 16px; white-space: nowrap; }
.badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
.badge.cur { background: var(--primary-soft); color: var(--primary); }
.badge.credit { background: #fff7ed; color: #c2410c; }

/* ---------- Reports ---------- */
.range-label { font-size: 13px; color: var(--muted); font-weight: 600; margin: 4px 4px 12px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.s-label { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.s-val { font-size: 19px; font-weight: 800; margin-top: 2px; overflow-wrap: anywhere; }
.stat.big { grid-column: 1 / -1; background: var(--primary); border-color: var(--primary); color: #fff; }
.stat.big .s-label { color: #c7d2fe; }
.stat.big .s-val { font-size: 30px; }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.list-row:last-child { border-bottom: none; }
.muted { color: var(--muted); font-size: 13px; }

/* ---------- Settings ---------- */
.logo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo-preview { width: 64px; height: 64px; border-radius: 12px; border: 1px dashed #cbd5e1; background: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 11px; color: var(--muted); text-align: center; }
.logo-preview img { max-width: 100%; max-height: 100%; }

/* ---------- Thermal receipt ---------- */
.receipt { width: 80mm; max-width: 100%; margin: 0 auto; background: #fff; color: #000; font-family: "Courier New", Courier, monospace; font-size: 12px; line-height: 1.35; padding: 14px 12px; position: relative; box-shadow: 0 10px 25px -5px rgba(0,0,0,.12); }
.receipt.p58 { width: 58mm; font-size: 11px; padding: 10px 7px; }
.receipt.flat { box-shadow: none; max-width: none; }
.r-center { text-align: center; }
.r-logo { display: block; max-width: 60%; max-height: 64px; margin: 0 auto 6px; }
.r-shop { font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: .5px; overflow-wrap: anywhere; }
.r-small { font-size: 10.5px; overflow-wrap: anywhere; }
.r-div { border-top: 1px dashed #000; margin: 8px 0; }
.r-title { font-weight: bold; letter-spacing: 2px; }
.r-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin: 1px 0; }
.r-row > span:last-child { text-align: right; overflow-wrap: anywhere; }
.r-items { position: relative; min-height: 60px; }
.r-head { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; border-bottom: 1px dashed #000; padding-bottom: 4px; margin-bottom: 4px; position: relative; z-index: 2; }
.r-item { padding: 3px 0; position: relative; z-index: 2; }
.r-item-name { font-weight: bold; overflow-wrap: anywhere; }
.r-item-line { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; padding-left: 14px; }
.r-total { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 4px 0; margin-top: 4px; }
.r-words { font-size: 10px; margin-top: 4px; }
.r-qr img { display: block; width: 120px; height: 120px; margin: 4px auto; image-rendering: pixelated; }
.r-foot { text-align: center; font-size: 10px; text-transform: uppercase; }
.r-stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); width: 120px; height: 120px; border: 3px solid #dc2626; border-radius: 50%; opacity: .3; z-index: 1; pointer-events: none; color: #dc2626; padding: 4px; font-family: "Arial Black", Impact, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.r-stamp-ring { width: 100%; height: 100%; border: 1px solid #dc2626; border-radius: 50%; position: relative; }
.r-stamp-band { position: absolute; top: 50%; left: 50%; width: 124%; transform: translate(-50%, -50%); background: #fff; border-top: 2px solid #dc2626; border-bottom: 2px solid #dc2626; text-align: center; padding: 2px 0; font-size: 24px; font-weight: 900; line-height: 1; letter-spacing: 1px; }
#render-area { position: absolute; top: 0; left: -10000px; }

/* ---------- Desktop / laptop ---------- */
@media (min-width: 900px) {
  :root { --nav-h: 0px; }
  .bottom-nav { display: none; }
  .top-tabs { display: flex; }
  .container { padding: 24px 20px; }
  .bill-layout { grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; }
  body[data-tab="bill"] .preview-col, body[data-tab="preview"] .preview-col, body[data-tab="preview"] .bill-col { display: block; }
  .preview-col { position: sticky; top: 84px; }
  .stats { grid-template-columns: repeat(4, 1fr); }
}

/* ---------- Print: only the receipt ---------- */
@media print {
  body { padding: 0 !important; background: #fff !important; }
  body > *:not(#render-area) { display: none !important; }
  #render-area { position: static !important; left: auto !important; }
  #render-area .receipt { width: 100% !important; max-width: 80mm !important; margin: 0 !important; padding: 2mm 1mm !important; box-shadow: none !important; }
  #render-area .receipt.p58 { max-width: 58mm !important; }
  @page { margin: 0; }
}
</style>
</head>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-name" id="hdr-shop">My Shop</div>
      <div class="brand-sub" id="hdr-bill"></div>
    </div>
    <nav class="top-tabs">
      <button data-tab="bill" data-i18n="nav_bill">Bill</button>
      <button data-tab="history" data-i18n="nav_history">History</button>
      <button data-tab="reports" data-i18n="nav_reports">Reports</button>
      <button data-tab="settings" data-i18n="nav_settings">Settings</button>
    </nav>
    <button class="btn-new" id="btn-new-bill"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="newBill">New Bill</span></button>
  </div>
</header>

<main class="container">

  <!-- ===== BILL + PREVIEW ===== -->
  <section class="view" id="view-bill">
    <div class="bill-layout">
      <div class="bill-col stack">

        <div class="card setup-card" id="setup-card" hidden>
          <div class="setup-text">
            <div class="setup-title" data-i18n="setupTitle"></div>
            <div class="hint" data-i18n="setupText"></div>
          </div>
          <button class="btn btn-primary" id="setup-go" data-i18n="setupBtn"></button>
        </div>

        <div class="card">
          <div class="quick-wrap" id="quick-wrap" hidden>
            <span class="label" data-i18n="quickItems"></span>
            <div class="chips" id="quick-chips"></div>
          </div>
          <div class="field">
            <label for="f-name" data-i18n="itemName"></label>
            <input id="f-name" class="input" type="text" autocomplete="off" enterkeyhint="next" data-i18n-ph="itemPh">
            <div class="suggest" id="suggest"></div>
          </div>
          <div class="grid-3 mt">
            <div class="field"><label for="f-qty" data-i18n="qty"></label><input id="f-qty" class="input" type="number" inputmode="decimal" step="any" min="0" enterkeyhint="next"></div>
            <div class="field"><label for="f-unit" data-i18n="unit"></label><select id="f-unit" class="input"></select></div>
            <div class="field"><label for="f-rate" id="f-rate-label"></label><input id="f-rate" class="input" type="number" inputmode="decimal" step="any" min="0" enterkeyhint="done"></div>
          </div>
          <button class="btn btn-primary btn-block mt" id="btn-add"><svg class="ic"><use href="#i-plus"/></svg><span id="btn-add-label"></span></button>
        </div>

        <div class="card">
          <div class="card-title"><span data-i18n="items"></span><span class="count" id="items-count"></span></div>
          <div id="items-list"></div>
        </div>

        <div class="card">
          <div class="card-title"><span data-i18n="billDetails"></span></div>
          <div class="grid-2">
            <div class="field"><label for="f-cust" data-i18n="customerName"></label><input id="f-cust" class="input" type="text" autocomplete="off" data-i18n-ph="optional"></div>
            <div class="field"><label for="f-phone" data-i18n="customerPhone"></label><input id="f-phone" class="input" type="tel" inputmode="tel" autocomplete="off" data-i18n-ph="optional"></div>
          </div>
          <div class="field mt">
            <label for="f-disc" data-i18n="discount"></label>
            <div class="input-group">
              <input id="f-disc" class="input" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
              <select id="f-disc-type" class="input"><option value="percent">%</option><option value="fixed">₹</option></select>
            </div>
          </div>
          <div class="field mt"><label for="f-date" data-i18n="dateTime"></label><input id="f-date" class="input" type="datetime-local"></div>
          <div class="field mt"><span class="label" data-i18n="payMode"></span><div class="segmented" id="pay-modes"></div></div>
          <div class="switch-row"><span data-i18n="paidStamp"></span><label class="switch"><input type="checkbox" id="f-paid"><span></span></label></div>
        </div>
      </div>

      <div class="preview-col">
        <div id="receipt-preview"></div>
      </div>
    </div>
  </section>

  <!-- ===== HISTORY ===== -->
  <section class="view narrow" id="view-history">
    <input id="h-search" class="input" type="search" data-i18n-ph="searchHistory">
    <div id="history-list"></div>
  </section>

  <!-- ===== REPORTS ===== -->
  <section class="view narrow" id="view-reports">
    <div class="chips" id="report-periods"></div>
    <div class="range-label" id="report-range"></div>
    <div id="report-body"></div>
  </section>

  <!-- ===== SETTINGS ===== -->
  <section class="view narrow" id="view-settings">
    <div class="stack">
      <div class="card">
        <div class="card-title"><span data-i18n="shopDetails"></span></div>
        <div class="field">
          <span class="label" data-i18n="logo"></span>
          <div class="logo-row">
            <div class="logo-preview" id="logo-preview"></div>
            <button class="btn btn-light" id="btn-logo" data-i18n="uploadLogo"></button>
            <button class="btn btn-danger-light" id="btn-logo-remove" data-i18n="removeLogo"></button>
            <input type="file" id="logo-input" accept="image/*" hidden>
          </div>
        </div>
        <div class="field mt"><label for="s-shop" data-i18n="shopName"></label><input id="s-shop" class="input" data-setting="shopName"></div>
        <div class="field mt"><label for="s-a1" data-i18n="address1"></label><input id="s-a1" class="input" data-setting="address1"></div>
        <div class="field mt"><label for="s-a2" data-i18n="address2"></label><input id="s-a2" class="input" data-setting="address2"></div>
        <div class="field mt"><label for="s-ph" data-i18n="phone"></label><input id="s-ph" class="input" type="tel" inputmode="tel" data-setting="phone"></div>
      </div>

      <div class="card">
        <div class="card-title"><span data-i18n="billSettings"></span></div>
        <div class="field"><label for="s-title" data-i18n="receiptTitle"></label><input id="s-title" class="input" data-setting="receiptTitle"></div>
        <div class="field mt"><label for="s-foot" data-i18n="footer"></label><input id="s-foot" class="input" data-setting="footer"></div>
        <div class="grid-2 mt">
          <div class="field"><label for="s-prefix" data-i18n="prefix"></label><input id="s-prefix" class="input" data-setting="prefix" autocapitalize="characters"></div>
          <div class="field"><label for="s-start" data-i18n="startNo"></label><input id="s-start" class="input" type="number" inputmode="numeric" min="1" data-setting="startNo"></div>
        </div>
        <div class="field mt"><label for="s-paper" data-i18n="paper"></label>
          <select id="s-paper" class="input" data-setting="paper"><option value="80">80 mm</option><option value="58">58 mm</option></select>
        </div>
        <div class="field mt"><label for="s-upi" data-i18n="upiId"></label>
          <input id="s-upi" class="input" data-setting="upiId" placeholder="9876543210@ybl" autocapitalize="off" autocorrect="off" spellcheck="false">
          <p class="hint" data-i18n="upiHint"></p>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span data-i18n="language"></span></div>
        <div class="segmented two" id="lang-switch">
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="pa">ਪੰਜਾਬੀ</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span data-i18n="savedItems"></span><span class="count" id="saved-count"></span></div>
        <div id="saved-items"></div>
      </div>

      <div class="card">
        <div class="card-title"><span data-i18n="backup"></span></div>
        <p class="hint" data-i18n="backupHint"></p>
        <div class="grid-2 mt">
          <button class="btn btn-primary" id="btn-backup" data-i18n="backupBtn"></button>
          <button class="btn btn-light" id="btn-restore" data-i18n="restoreBtn"></button>
        </div>
        <input type="file" id="restore-input" accept=".json,application/json" hidden>
      </div>
    </div>
  </section>
</main>

<!-- Total + actions -->
<div class="action-bar">
  <div class="action-inner">
    <div class="total-box">
      <div class="total-label"><span data-i18n="total"></span> · <span id="bar-count">0</span> <span data-i18n="itemsCount"></span></div>
      <div class="total-amt" id="bar-total">₹0.00</div>
    </div>
    <button class="btn btn-light" id="btn-print"><svg class="ic"><use href="#i-print"/></svg><span data-i18n="print"></span></button>
    <button class="btn btn-primary" id="btn-share"><svg class="ic"><use href="#i-share"/></svg><span data-i18n="share"></span></button>
    <button class="btn btn-wa" id="btn-wa"><svg class="ic"><use href="#i-chat"/></svg><span>WhatsApp</span></button>
  </div>
</div>

<!-- Phone navigation -->
<nav class="bottom-nav">
  <button data-tab="bill"><svg class="ic"><use href="#i-bill"/></svg><span data-i18n="nav_bill"></span></button>
  <button data-tab="preview"><svg class="ic"><use href="#i-eye"/></svg><span data-i18n="nav_preview"></span></button>
  <button data-tab="history"><svg class="ic"><use href="#i-clock"/></svg><span data-i18n="nav_history"></span></button>
  <button data-tab="reports"><svg class="ic"><use href="#i-chart"/></svg><span data-i18n="nav_reports"></span></button>
  <button data-tab="settings"><svg class="ic"><use href="#i-gear"/></svg><span data-i18n="nav_settings"></span></button>
</nav>

<!-- Edit item popup -->
<div class="sheet-backdrop" id="edit-sheet">
  <div class="sheet">
    <div class="sheet-title"><span data-i18n="editItem"></span></div>
    <div class="field"><label for="e-name" data-i18n="itemName"></label><input id="e-name" class="input" type="text" autocomplete="off"></div>
    <div class="grid-3 mt">
      <div class="field"><label for="e-qty" data-i18n="qty"></label><input id="e-qty" class="input" type="number" inputmode="decimal" step="any" min="0"></div>
      <div class="field"><label for="e-unit" data-i18n="unit"></label><select id="e-unit" class="input"></select></div>
      <div class="field"><label for="e-rate" id="e-rate-label"></label><input id="e-rate" class="input" type="number" inputmode="decimal" step="any" min="0"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-danger-light" id="e-delete" data-i18n="delete"></button>
      <button class="btn btn-primary" id="e-save" data-i18n="save"></button>
    </div>
    <button class="btn btn-light btn-block mt" id="e-cancel" data-i18n="cancel"></button>
  </div>
</div>

<!-- Old bill popup -->
<div class="sheet-backdrop" id="bill-sheet">
  <div class="sheet">
    <div class="sheet-title"><span id="bs-title"></span><button class="icon-btn plain" id="bs-close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="bs-receipt" id="bs-receipt"></div>
    <div class="sheet-actions three">
      <button class="btn btn-light" id="bs-print"><svg class="ic"><use href="#i-print"/></svg><span data-i18n="print"></span></button>
      <button class="btn btn-primary" id="bs-share"><svg class="ic"><use href="#i-share"/></svg><span data-i18n="share"></span></button>
      <button class="btn btn-wa" id="bs-wa"><svg class="ic"><use href="#i-chat"/></svg><span>WhatsApp</span></button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-danger-light" id="bs-delete" data-i18n="delete"></button>
      <button class="btn btn-light" id="bs-open" data-i18n="editBill"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-btn" hidden></button></div>
<div id="render-area"></div>

<script src="lang.js"></script>
<script src="app.js"></script>
</body>
</html>
